name: Build iStoreOS trimmed

on:
  workflow_dispatch:

concurrency:
  group: istoreos-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev file wget python3 python3-setuptools \
            python3-pyelftools swig python3-dev
          sudo apt-get install -y python3-distutils || true

      # 缓存拆成 dl / 工具链两对独立的 restore+save：
      # actions/cache@v4 的 post 保存只在 job 成功时跑(post-if: success())，而冷编译超过
      # timeout → job 被取消 → post 跳过 → 缓存永远是空的 → 每次都全量重编(run 37422215944
      # 编到 ruby 被杀，6 次 run 无一成功、仓库 0 条缓存，死循环)。拆开后 save 挂 always()，
      # 被超时取消也会存(同 run 的 Report disk usage 以 always() 在取消后照常执行，已验证)；
      # 工具链能续上，下次 run 就能从 package/compile 接着跑而不是从零开始。
      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: istoreos-dl-${{ github.run_id }}
          restore-keys: istoreos-dl-

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: staging_dir
          key: istoreos-tc-${{ github.run_id }}
          restore-keys: istoreos-tc-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config
        shell: bash
        run: |
          cp config-custom.seed .config
          make defconfig
          # 审计：defconfig 会无警告删掉"符号不存在"的行，也要靠 tmp/.config-package.in 区分
          # "名字写错/包没了"与"符号存在但依赖不满足"，否则要到 rootfs 装配才暴露
          grep -oE '(menu)?config PACKAGE_[A-Za-z0-9_.+-]+' tmp/.config-package.in | sed 's/.*config //' | sort -u > ksyms.txt
          grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y' config-custom.seed | sed 's/^CONFIG_//; s/=y$//' | sort -u > want.txt
          grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=[ym]' .config | sed 's/^CONFIG_//; s/=[ym]$//' | sort -u > on.txt
          comm -23 want.txt on.txt > lost.txt
          grep -Fxf ksyms.txt lost.txt > lost_hidden.txt || true
          comm -23 lost.txt lost_hidden.txt > lost_dead.txt
          {
            echo "seed 想要: $(wc -l < want.txt)  defconfig 后开启: $(wc -l < on.txt)  丢失: $(wc -l < lost.txt)"
            echo; echo "== 符号不存在（seed 写的是 opkg 二元包名/改名/包已消失），这些行一直是死行 =="
            cat lost_dead.txt
            echo; echo "== 符号存在但没能开启（依赖不满足或被隐藏）——这些是真的缺包 =="
            cat lost_hidden.txt
          } | tee seed-audit.txt
          echo "::warning::seed 有 $(wc -l < lost.txt) 行未生效，详见 seed-audit.txt"
          if grep -q '^CONFIG_PACKAGE_dnsmasq=y$' .config; then
            echo "::error::dnsmasq(非 full)又被加回，会与 dnsmasq-full 抢文件；说明有保留包 select 了默认变体"
            exit 1
          fi
          echo "kconfig 包符号总数: $(wc -l < ksyms.txt)"
          # 产物里要能看到展开后的完整 .config；upload-artifact 不收点文件，先改名
          cp .config config-expanded.txt

      - name: Upload config audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-audit-r${{ github.run_number }}
          path: |
            config-expanded.txt
            seed-audit.txt
            ksyms.txt
            lost.txt
          retention-days: 14
          compression-level: 0

      - name: Pre-seed sources with dead upstream URLs
        shell: bash
        run: |
          # third feed 的 vlmcsd Makefile 抓 refs/tags/1113.tar.gz，可上游 tag 其实叫 svn1113 →
          # 三个镜像全 404(run 37347586447 编译 3.8h 后才炸)。不改 feed 源码：把内容正确的包按
          # dl/ 里的目标文件名放好，download.mk 见文件存在且 sha256 == PKG_HASH 就不下(FORCE 只在哈希不符时加)
          set -euo pipefail
          seed_dl() {
            local file="$1" url="$2" makefile="$3" hash
            hash=$(sed -n 's/^PKG_HASH:=//p' "$makefile")
            [ -n "$hash" ] || { echo "::error::$makefile 里没有 PKG_HASH，预置无从校验"; exit 1; }
            if [ -f "dl/$file" ] && [ "$(sha256sum < "dl/$file" | cut -d' ' -f1)" = "$hash" ]; then
              echo "dl/$file 已就绪(哈希匹配)，跳过"
              return
            fi
            curl -fSL --connect-timeout 20 --retry 3 -o "dl/$file.part" "$url"
            ( cd dl && echo "$hash  $file.part" | sha256sum -c - )
            mv "dl/$file.part" "dl/$file"
            echo "dl/$file <- $url"
          }
          mkdir -p dl
          seed_dl vlmcsd-1113.tar.gz \
            https://github.com/Wind4/vlmcsd/archive/refs/tags/svn1113.tar.gz \
            package/feeds/third/vlmcsd/Makefile

      - name: Download sources
        shell: bash
        run: |
          # make download 里失败的包只打 ERROR、不改退出码(run 37347586447 步 9 绿、编译期才炸)，
          # 所以自己扫日志：死源码在这里几分钟就能暴露，不必等 3.8 小时
          set -o pipefail
          make download -j$(nproc) 2>&1 | tee download.log
          # 每个 grep 都补 || true：GH 用 bash -e 跑，pipefail 下"没匹配"(rc=1)会把干净构建也判死
          bad=$(grep -oE 'ERROR: package/[^ ]+ failed to build' download.log | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::download 阶段有包失败（make download 仍返回 0，故必须在这里拦）"
            echo "$bad"
            for b in $(grep -oE '\*\*\* \[Makefile:[0-9]+: [^]]*dl/[^] ]+' download.log | sed 's|.*/dl/||' | sort -u); do
              echo "-- $b 尝试过的 URL:"
              grep -F "$b" download.log | grep -oE 'https?://[A-Za-z0-9./:_-]+' | sort -u | sed 's/^/     /'
            done
            exit 1
          fi

      # dl 在 download 完成后立即存：此刻 job 还健康，上传从容；编译超时也不影响这份缓存
      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: istoreos-dl-${{ github.run_id }}

      - name: Compile
        run: |
          make -j$(nproc) || make -j1 V=s
          df -hT

      # 工具链缓存在 Compile 后存，挂 always()：即使编译超时被取消也把 staging_dir 存下来，
      # 下次 run 恢复后 tools/toolchain 靠 stamp 跳过，从 package/compile 续编
      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: staging_dir
          key: istoreos-tc-${{ github.run_id }}

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-x86_64-trimmed-r${{ github.run_number }}
          path: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/sha256sums
            bin/targets/x86/64/manifest
          retention-days: 14
          compression-level: 0

      - name: Report disk usage
        if: always()
        run: df -hT
