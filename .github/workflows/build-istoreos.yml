name: Build iStoreOS trimmed

on:
  workflow_dispatch:

concurrency:
  group: istoreos-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # 清单在 .github/apt-packages.txt，与 BUILD-CUSTOM.md 共用一份，两边用同一种读法。
          # 空清单必须拦：apt-get install -y 不带包名照样返回 0，会静默装出一个啥也没有的环境
          pkgs=$(grep -vE '^[[:space:]]*(#|$)' .github/apt-packages.txt)
          [ -n "$pkgs" ] || { echo "::error::.github/apt-packages.txt 读不出包名（文件缺失或全被注释）"; exit 1; }
          sudo apt-get install -y $pkgs

      # 缓存拆成 dl / 工具链两对独立的 restore+save，只为破死循环：actions/cache@v4 的保存挂在
      # post 步骤且 post-if: success()，而 job 一次次被自家 timeout 杀掉（§十一），结果 6 次 run
      # 无一成功、仓库 0 条缓存、每次从零重编。拆开后 save 挂 always()，被超时取消也照存（同 run 的
      # Report disk usage 以 always() 在取消后照常执行，已验证；r7 也已实测存进 dl 1.24GB / tc 1.12GB）。
      #
      # dl 的收益确定（省掉那 28 分钟下载，r7 实测）。staging_dir 这份按规则判定不能续编：
      # .prepared/.configured/.built 都落在 PKG_BUILD_DIR（build_dir/，这里没缓存），只有
      # *_installed 在 staging_dir/stamp（package.mk:114-119、host-build.mk:27-28）——缺 .built
      # 就仍要重跑。下次 run 用 tools/compile 实测时长定性（仍约 1h15m 即坐实，那是 r7 的冷缓存
      # 实测 1h14m43s；接近 0 才说明这行注释错了，见 §十一「复核更正」与 §十三）
      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: istoreos-dl-${{ github.run_id }}
          restore-keys: istoreos-dl-

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: staging_dir
          key: istoreos-tc-${{ github.run_id }}
          restore-keys: istoreos-tc-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config
        run: |
          cp config-custom.seed .config
          make defconfig
          bash .github/scripts/seed-audit.sh
          # 产物里要能看到展开后的完整 .config；upload-artifact 不收点文件，先改名
          cp .config config-expanded.txt

      - name: Upload config audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-audit-r${{ github.run_number }}
          path: |
            config-expanded.txt
            seed-audit.txt
            lost_dead.txt
            lost_hidden.txt
          retention-days: 14
          compression-level: 0

      - name: Patch the broken vlmcsd feed Makefile
        run: |
          # jjm2473/openwrt-third 的 vlmcsd 有两处笔误，两处都致命（run 37470180070 里唯一失败的就是它）：
          #   ① 远端文件名 PKG_SOURCE_URL_FILE:=1113.tar.gz，可上游 tag 其实叫 svn1113 → GitHub+3 个镜像全 404
          #   ② PKG_BUILD_DIR 少了 svn 前缀。tar 解到 build_dir/vlmcsd-svn1113，构建却 cd 进空目录
          #      build_dir/vlmcsd-1113 → "No targets specified and no makefile found"（0.07 秒挂）
          # feed 是 scripts/feeds install 出来的副本、不在本仓库版本里，就地改它，vlmcsd 照旧进固件。
          # 补上 svn 前缀后 PKG_SOURCE/URL 都由这一行推导，哈希仍由 OpenWrt 自己校验（PKG_HASH 本来就对得上）
          set -euo pipefail
          m=package/feeds/third/vlmcsd/Makefile
          [ -f "$m" ] || { echo "::error::$m 不存在，third feed 可能改了包名"; exit 1; }
          # 借临时文件改写而不是 sed -i：`sed -i -e ...` 只有 GNU sed 认，写成可移植的形式两边都能跑
          sed -e 's|^PKG_SOURCE_URL_FILE:.*|PKG_SOURCE_URL_FILE:=svn$(PKG_VERSION).tar.gz|' \
              -e 's|^PKG_BUILD_DIR:.*|PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-svn$(PKG_VERSION)|' \
              "$m" > "$m.tmp" && mv "$m.tmp" "$m"
          grep -E '^(PKG_SOURCE_URL_FILE|PKG_BUILD_DIR):=' "$m"

      - name: Download sources
        run: |
          # make download 里失败的包只打 ERROR、不改退出码(run 37347586447 步 9 绿、编译期才炸)，
          # 所以自己扫日志：死源码在这里几分钟就能暴露，不必等 3.8 小时
          set -o pipefail
          make download -j$(nproc) 2>&1 | tee download.log
          # 每个 grep 都补 || true：GH 用 bash -e 跑，pipefail 下"没匹配"(rc=1)会把干净构建也判死
          bad=$(grep -oE 'ERROR: package/[^ ]+ failed to build' download.log | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::download 阶段有包失败（make download 仍返回 0，故必须在这里拦）"
            echo "$bad"
            for b in $(grep -oE '\*\*\* \[Makefile:[0-9]+: [^]]*dl/[^] ]+' download.log | sed 's|.*/dl/||' | sort -u); do
              echo "-- $b 尝试过的 URL:"
              grep -F "$b" download.log | grep -oE 'https?://[A-Za-z0-9./:_-]+' | sort -u | sed 's/^/     /' || true
            done
            exit 1
          fi

      # dl 在 download 完成后立即存：此刻 job 还健康，上传从容；编译超时也不影响这份缓存
      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: istoreos-dl-${{ github.run_id }}

      - name: Compile
        run: |
          # 两条纪律，都是 run 37470180070 教的：
          # ① pipefail 要显式写：没标 shell: 的步骤用 `bash -e {0}`(日志里的原文)，不带 pipefail，
          #    `make | tee` 的退出码取自 tee=0——编译炸了步骤照样绿
          # ② 失败后不再全局 `make -j1 V=s`：那次它从 17:40 单线程重跑到 18:48 才又撞上同一个错，
          #    白烧 1h08m。改成只把出错的那几个包重跑，几十秒就打出真实原因
          set -eo pipefail
          if make -j$(nproc) 2>&1 | tee compile.log; then exit 0; fi
          pkgs=$(grep -oE 'ERROR: package/[^ ]+ failed to build' compile.log | sed -E 's|^ERROR: (package/[^ ]+) failed to build$|\1|' | sort -u || true)
          if [ -z "$pkgs" ]; then
            echo "::error::compile.log 里没有 ERROR: package 行（可能是 tools/kernel 挂了），原因见上传的 compile.log"
            exit 1
          fi
          for p in $pkgs; do
            echo "::group::verbose 重跑 $p"
            make $p/{download,prepare,compile} -j1 V=s || true
            echo "::endgroup::"
          done
          exit 1

      # 工具链缓存在 Compile 后存，挂 always()：被超时取消也把 staging_dir 存下来。
      # 它能不能真的续编未证（*_installed 在 staging_dir，.built/.prepared/.configured 在没缓存的
      # build_dir），定性看下次 run 的 tools/compile 耗时——见文件头那段缓存注释。
      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: staging_dir
          key: istoreos-tc-${{ github.run_id }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-r${{ github.run_number }}
          path: compile.log
          retention-days: 14

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-x86_64-trimmed-r${{ github.run_number }}
          path: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/sha256sums
            bin/targets/x86/64/manifest
          retention-days: 14
          compression-level: 0

      - name: Report disk usage
        if: always()
        run: |
          df -hT
          # 顺手把"连 build_dir 一起缓存"到底装不装得下量出来：本机是 M1 Max，跑不了 x86 构建树，
          # 只有这里有真实数字（r7 实测 dl 1.240GB / staging_dir 1.117GB，build_dir 一直缺测）。
          # run 若在中途失败，build_dir 是全量体积的下限，读数时记得带上这个前提。
          for d in dl staging_dir build_dir; do
            if [ -d "$d" ]; then
              printf '%s: %s\n' "$d" "$(du -sh "$d" | cut -f1)"
            else
              printf '%s: 目录不存在\n' "$d"
            fi
          done
          # §十一 那张 stamp 落点表的现场版：恢复过缓存后 .built 仍是 0 而 *_installed 有值，
          # 就说明 staging_dir 那份缓存确实买不到"续编"
          printf 'stamp 落点计数 .built(build_dir 内)=%s *_installed(staging_dir 内)=%s\n' \
            "$(find build_dir -name '.built*' 2>/dev/null | wc -l)" \
            "$(find staging_dir -name '*_installed' 2>/dev/null | wc -l)"
