name: Build iStoreOS trimmed

on:
  workflow_dispatch:

concurrency:
  group: istoreos-build
  cancel-in-progress: false

jobs:
  build:
    # 钉 24.04：ubuntu-latest 从 2026-10-19 起切到 26，OpenWrt 主机工具链别跟着漂
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # 构建 job 只需要读代码/发 artifact；写权限挪到独立的 publish job，
    # 免得仓库里任何脚本被改动都能直接发 Release。仓库全局默认仍是 read。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # token 不留在 .git/config；本 job 不需要 push
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # 清单在 .github/apt-packages.txt，与 BUILD-CUSTOM.md 共用一份，两边用同一种读法。
          # 空清单必须拦：apt-get install -y 不带包名照样返回 0，会静默装出一个啥也没有的环境
          pkgs=$(grep -vE '^[[:space:]]*(#|$)' .github/apt-packages.txt)
          [ -n "$pkgs" ] || { echo "::error::.github/apt-packages.txt 读不出包名（文件缺失或全被注释）"; exit 1; }
          sudo apt-get install -y $pkgs

      # 缓存只剩 dl 一对 restore+save：save 挂 always()，被超时取消也照存（同 run 的
      # Report disk usage 以 always() 在取消后照常执行，已验证；r7 也已实测存进 dl 1.24GB）。
      # dl 的收益确定（省掉那 28 分钟下载，r7 实测）。
      # staging_dir 缓存已删：stamp .built 在 build_dir，缓存 staging_dir 买不到续编，见 docs/CUSTOM-TRIMMING.md §十一。
      - name: Restore downloads cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: dl
          key: istoreos-dl-${{ github.run_id }}
          restore-keys: istoreos-dl-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pin Tailscale official amd64 + LuCI
        run: bash .github/scripts/pin-tailscale-prebuilt.sh

      - name: Pin QuickStart homepage without NAS cards
        run: bash .github/scripts/pin-quickstart.sh

      - name: Patch argon menu-search style
        run: bash .github/scripts/patch-argon-menu-search.sh

      - name: Drop luci-theme-bootstrap (Argon only)
        run: bash .github/scripts/drop-luci-theme-bootstrap.sh

      - name: Apply custom config
        run: |
          cp config-custom.seed .config
          make defconfig
          # Stamp DISTRIB_REVISION as r<run_number> for GitHub OTA comparison (§三十七)
          sed -i '/^CONFIG_VERSION_CODE=/d' .config
          echo "CONFIG_VERSION_CODE=\"r${GITHUB_RUN_NUMBER}\"" >> .config
          grep -E '^CONFIG_VERSION_CODE=' .config
          bash .github/scripts/seed-audit.sh
          # 产物里要能看到展开后的完整 .config；upload-artifact 不收点文件，先改名
          cp .config config-expanded.txt

      - name: Upload config audit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: seed-audit-r${{ github.run_number }}
          path: |
            config-expanded.txt
            seed-audit.txt
            lost_dead.txt
            lost_hidden.txt
          retention-days: 14
          compression-level: 0

      - name: Patch the broken vlmcsd feed Makefile
        run: |
          # jjm2473/openwrt-third 的 vlmcsd 有两处致命笔误（run 37470180070 里唯一失败的就是它）：
          #   ① PKG_SOURCE_URL_FILE:=1113.tar.gz → GitHub+3 镜像全 404，上游 tag 其实叫 svn1113
          #   ② PKG_BUILD_DIR 少了 svn 前缀 → 构建进空目录或"No targets specified"
          # 锚定整行再替换：避免 feed 作者改写法后二次加前缀拼出 svnsvn1113（third 跟踪 main）；
          # 替换后校验两行是否恰为修好的形式，不符则 error 退出让人工复核。
          set -euo pipefail
          m=package/feeds/third/vlmcsd/Makefile
          [ -f "$m" ] || { echo "::error::$m 不存在，third feed 可能改了包名"; exit 1; }
          v=$(sed -n 's/^PKG_VERSION:=//p' "$m")
          if [[ "$v" == svn* ]]; then
            echo "::warning::vlmcsd PKG_VERSION 已以 svn 开头，跳过补丁 (third feed 可能已改用其他修法)"
            grep -E '^(PKG_VERSION|PKG_SOURCE_URL_FILE|PKG_BUILD_DIR):=' "$m"
            exit 0
          fi
          # 借临时文件改写而不是 sed -i：`sed -i -e ...` 只有 GNU sed 认，写成可移植的形式两边都能跑
          sed -e 's|^PKG_SOURCE_URL_FILE:=\$(PKG_VERSION)\.tar\.gz$|PKG_SOURCE_URL_FILE:=svn$(PKG_VERSION).tar.gz|' \
              -e 's|^PKG_BUILD_DIR:=\$(BUILD_DIR)/\$(PKG_NAME)-\$(PKG_VERSION)$|PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-svn$(PKG_VERSION)|' \
              "$m" > "$m.tmp" && mv "$m.tmp" "$m"
          grep -E '^(PKG_SOURCE_URL_FILE|PKG_BUILD_DIR):=' "$m"
          if ! grep -qxF 'PKG_SOURCE_URL_FILE:=svn$(PKG_VERSION).tar.gz' "$m" || \
             ! grep -qxF 'PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-svn$(PKG_VERSION)' "$m"; then
            echo "::error::vlmcsd 补丁校验失败，feed 可能已改写法，需要人工复核"
            grep -E '^(PKG_SOURCE_URL_FILE|PKG_BUILD_DIR):=' "$m"
            exit 1
          fi

      - name: Download sources
        run: |
          # make download 里失败的包只打 ERROR、不改退出码(run 37347586447 步 9 绿、编译期才炸)，
          # 所以自己扫日志：死源码在这里几分钟就能暴露，不必等 3.8 小时
          set -o pipefail
          make download -j$(nproc) 2>&1 | tee download.log
          # 每个 grep 都补 || true：GH 用 bash -e 跑，pipefail 下"没匹配"(rc=1)会把干净构建也判死
          bad=$(grep -oE 'ERROR: package/[^ ]+ failed to build' download.log | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::download 阶段有包失败（make download 仍返回 0，故必须在这里拦）"
            echo "$bad"
            for b in $(grep -oE '\*\*\* \[Makefile:[0-9]+: [^]]*dl/[^] ]+' download.log | sed 's|.*/dl/||' | sort -u); do
              echo "-- $b 尝试过的 URL:"
              grep -F "$b" download.log | grep -oE 'https?://[A-Za-z0-9./:_-]+' | sort -u | sed 's/^/     /' || true
            done
            pkgs=$(echo "$bad" | sed -E 's|^ERROR: (package/[^ ]+) failed to build$|\1|' | sort -u || true)
            for p in $pkgs; do
              echo "::group::verbose 重跑 $p/download"
              make $p/download -j1 V=s || true
              echo "::endgroup::"
            done
            exit 1
          fi

      # dl 在 download 完成后立即存：此刻 job 还健康，上传从容；编译超时也不影响这份缓存
      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: dl
          key: istoreos-dl-${{ github.run_id }}

      - name: Compile
        run: |
          # 两条纪律，都是 run 37470180070 教的：
          # ① pipefail 要显式写：没标 shell: 的步骤用 `bash -e {0}`(日志里的原文)，不带 pipefail，
          #    `make | tee` 的退出码取自 tee=0——编译炸了步骤照样绿
          # ② 失败后不再全局 `make -j1 V=s`：那次它从 17:40 单线程重跑到 18:48 才又撞上同一个错，
          #    白烧 1h08m。改成只把出错的那几个包重跑，几十秒就打出真实原因
          set -eo pipefail
          if make -j$(nproc) 2>&1 | tee compile.log; then exit 0; fi
          pkgs=$(grep -oE 'ERROR: package/[^ ]+ failed to build' compile.log | sed -E 's|^ERROR: (package/[^ ]+) failed to build$|\1|' | sort -u || true)
          if [ -z "$pkgs" ]; then
            # r9：包全绿，挂在 target/linux install（打盘）。quiet make 不把 mksquashfs/make_ext4fs
            # 原文打到 compile.log，必须 V=s 重跑这一步，并带走 logs/target。
            if grep -q 'ERROR: target/linux failed to build' compile.log; then
              echo "::group::verbose 重跑 target/linux/install"
              make target/linux/install -j1 V=s 2>&1 | tee -a compile.log || true
              echo "::endgroup::"
            # r34：包全绿，挂在 package/install（rootfs/opkg 装配）。quiet 把 Collected errors /
            # postinst 原文吞进 /dev/null，必须 V=s 重跑才能看见冲突或缺依赖。
            elif grep -q 'make\[2\] package/install' compile.log; then
              echo "::group::verbose 重跑 package/install"
              make package/install -j1 V=s 2>&1 | tee -a compile.log || true
              echo "::endgroup::"
              echo "::error::package/install（rootfs 装配）失败；见上方 V=s 日志 / compile.log 末尾（Collected errors / postinst / 文件冲突）"
            else
              echo "::error::compile.log 里没有 ERROR: package / target/linux / package/install 行（可能是 tools 挂了），原因见上传的 compile.log"
            fi
            exit 1
          fi
          for p in $pkgs; do
            echo "::group::verbose 重跑 $p"
            make $p/{download,prepare,compile} -j1 V=s || true
            echo "::endgroup::"
          done
          exit 1

      # defconfig 的静默丢行、feed 改名、pin 脚本失效，最终都只会体现在 manifest。
      # 关键包缺一个就不该发 Release：首页/OTA/DDNS/Tailscale 都是开箱承诺。
      - name: Assert firmware contains key packages
        run: |
          set -euo pipefail
          m=$(ls bin/targets/x86/64/*.manifest 2>/dev/null | head -1)
          [ -n "$m" ] || { echo "::error::找不到 bin/targets/x86/64/*.manifest"; exit 1; }
          echo "manifest: $m"
          missing=0
          for p in tailscale luci-app-tailscale ddns-go luci-app-ddns-go \
                   luci-app-ota luci-i18n-ota-zh-cn istoreos-ops \
                   luci-app-istoreos-health luci-app-quickstart \
                   luci-theme-argon luci-app-openlist; do
            if ! grep -qE "^${p} " "$m"; then
              echo "::error::manifest 缺少 $p（defconfig 丢行或 pin 脚本失效）"
              missing=1
            fi
          done
          # 明确删掉的东西不许回来（§二/§二十四）
          for p in luci-theme-bootstrap dockerd samba4-server luci-app-samba4 \
                   ddnsto luci-app-ddns; do
            if grep -qE "^${p} " "$m"; then
              echo "::error::manifest 出现已删除的 $p（seed 或依赖被改回）"
              missing=1
            fi
          done
          grep -E '^(tailscale|ddns-go|luci-app-ota|istoreos-ops|luci-app-quickstart) ' "$m" || true
          exit "$missing"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compile-log-r${{ github.run_number }}
          path: |
            compile.log
            logs/target
          retention-days: 14
          if-no-files-found: warn

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: istoreos-x86_64-trimmed-r${{ github.run_number }}
          path: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/*.iso
            bin/targets/x86/64/sha256sums
            bin/targets/x86/64/*.manifest
          retention-days: 14
          compression-level: 0

      - name: Report disk usage
        if: always()
        run: |
          df -hT
          # 顺手把"连 build_dir 一起缓存"到底装不装得下量出来：本机是 M1 Max，跑不了 x86 构建树，
          # 只有这里有真实数字（r7 实测 dl 1.240GB，build_dir 一直缺测），用来定要不要上 9400F 自建 runner。
          # run 若在中途失败，build_dir 是全量体积的下限，读数时记得带上这个前提。
          for d in dl build_dir; do
            if [ -d "$d" ]; then
              printf '%s: %s\n' "$d" "$(du -sh "$d" | cut -f1)"
            else
              printf '%s: 目录不存在\n' "$d"
            fi
          done

  # 发布单独成 job：contents: write 只在这里、且只在 build 成功后生效。
  # 构建 job 里的脚本即使被改动，也拿不到写权限。同一次 run 重跑会命中已有 tag，
  # 用 upload --clobber 覆盖（r36 的 Publish 静默失败就是同 tag 已存在）。
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: istoreos-x86_64-trimmed-r${{ github.run_number }}
          path: bin/targets/x86/64

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="r${GITHUB_RUN_NUMBER}"
          imgs=(bin/targets/x86/64/*squashfs-combined-efi.img.gz)
          [ ${#imgs[@]} -ge 1 ] || { echo "::error::缺少 combined-efi.img.gz"; exit 1; }
          img=${imgs[0]}
          base=$(basename "$img")
          # OpenWrt sha256sums is binary-mode: "<hash> *<filename>". Text mode is
          # "<hash>  <filename>". r36 died here: grep '[ /]' misses the '*', and with
          # pipefail the failed grep aborts before the fallback (silent exit 1).
          sum=$(awk -v f="$base" '
            {
              name=$2
              sub(/^\*/, "", name)
              if (name == f) { print $1; exit }
            }
          ' bin/targets/x86/64/sha256sums)
          [ -n "$sum" ] || { echo "::error::sha256sums 里没有 $base"; exit 1; }
          {
            echo "TAG=${tag}"
            echo "ASSET=${base}"
            echo "SHA256=${sum}"
            echo "BROWSER_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${base}"
          } > bin/targets/x86/64/ota.meta
          cat bin/targets/x86/64/ota.meta
          files=(bin/targets/x86/64/*.img.gz bin/targets/x86/64/*.iso bin/targets/x86/64/sha256sums bin/targets/x86/64/*.manifest bin/targets/x86/64/ota.meta)
          [ ${#files[@]} -ge 1 ] || { echo "::error::没有可上传产物"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::缺少产物 $f，不建 Release"; exit 1; }
          done
          notes="iStoreOS 裁剪版（x86_64，目标机 J4125 四口 2.5G；先在 N100 验证，不要直接刷正在用的 J4125）。

          - 构建提交：\`${GITHUB_SHA:0:10}\`
          - 构建日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 下载 \`*-squashfs-combined-efi.img.gz\`，**解压**得到 \`.img\` 后整盘写入（不是直接把 gz 写进盘）
          - 已刷裁剪版可用 LuCI「系统 → OTA」从本 Releases 检查/下载（校验 sha256；需手动确认刷写，不会自动刷）
          - 刷机步骤见仓库 \`BUILD-CUSTOM.md\`；裁剪记录见 \`docs/CUSTOM-TRIMMING.md\`
          - 包清单见 \`.manifest\`，校验值见 \`sha256sums\`"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "iStoreOS 裁剪版 ${tag}" --notes "$notes"
          fi
