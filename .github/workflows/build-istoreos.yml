name: Build iStoreOS trimmed

on:
  workflow_dispatch:

concurrency:
  group: istoreos-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev file wget python3 python3-setuptools \
            python3-pyelftools swig python3-dev
          sudo apt-get install -y python3-distutils || true

      - name: Cache toolchain and downloads
        uses: actions/cache@v4
        with:
          path: |
            dl
            staging_dir
            toolchain
          key: istoreos-cache-${{ github.run_id }}
          restore-keys: istoreos-cache-

      - name: Apply custom config
        run: |
          cp config-custom.seed .config
          make defconfig
          grep -c "=y" .config

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download sources
        run: make download -j$(nproc)

      - name: Compile
        run: |
          make -j$(nproc) || make -j1 V=s
          df -hT

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-x86_64-trimmed-r${{ github.run_number }}
          path: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/sha256sums
            bin/targets/x86/64/manifest
          retention-days: 14
          compression-level: 0

      - name: Report disk usage
        if: always()
        run: df -hT
