# 临时恢复 r49；只读取固定来源 run 的原始 artifact，完成后删除本入口。
name: Recover r49 release
'on':
  workflow_dispatch: null
concurrency:
  group: istoreos-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify:
    name: 校验 r49 原始产物
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
    - name: Download image artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: istoreos-x86_64-trimmed-r49
        path: bin/targets/x86/64
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 41569983777
    - name: Verify image files and checksums
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        cd bin/targets/x86/64
        efi=(*squashfs-combined-efi.img.gz)
        bios=(*squashfs-combined.img.gz)
        isos=(*.iso)
        manifests=(*.manifest)
        [ ${#efi[@]} -eq 1 ] || { echo "::error::需要唯一的 EFI 镜像"; exit 1; }
        [ ${#bios[@]} -eq 1 ] || { echo "::error::需要唯一的 BIOS 镜像"; exit 1; }
        [ ${#isos[@]} -ge 1 ] || { echo "::error::缺少 LiveCD ISO"; exit 1; }
        [ ${#manifests[@]} -ge 1 ] || { echo "::error::缺少 manifest"; exit 1; }
        [ -s sha256sums ] || { echo "::error::缺少 sha256sums"; exit 1; }
        # sha256sums 还列了未上传的内核等文件，只逐个校验本次发布的文件。
        # 同时兼容二进制模式的 *filename 与文本模式的 filename（§三十七补）。
        files=(*.img.gz *.iso *.manifest)
        for file in "${files[@]}"; do
          sum=$(awk -v f="$file" '{ name=$2; sub(/^\*/, "", name); if (name == f) { print $1; exit } }' sha256sums)
          [[ "$sum" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::sha256sums 缺少有效校验值：$file"; exit 1; }
          printf '%s  %s\n' "$sum" "$file" | sha256sum --check -
        done
        # x86 combined.img.gz / combined-efi.img.gz 在 gzip 后 append-metadata（§四十九），
        # 通用 gzip --test 会对合法升级元数据返回 2；完整文件的 SHA256 已覆盖该尾部。
    - name: Assert firmware contains key packages
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        missing=0
        for m in bin/targets/x86/64/*.manifest; do
          echo "manifest: $m"
          for p in tailscale luci-app-tailscale ddns-go luci-app-ddns-go \
                   luci-app-ota luci-i18n-ota-zh-cn istoreos-ops \
                   luci-app-istoreos-health luci-app-quickstart \
                   luci-theme-argon luci-app-openlist; do
            if ! grep -qE "^${p} " "$m"; then
              echo "::error::manifest 缺少 $p（defconfig 丢行或 pin 脚本失效）"
              missing=1
            fi
          done
          # 明确删掉的东西不许回来（§二/§二十四）
          for p in luci-theme-bootstrap dockerd samba4-server luci-app-samba4 \
                   ddnsto luci-app-ddns; do
            if grep -qE "^${p} " "$m"; then
              echo "::error::manifest 出现已删除的 $p（seed 或依赖被改回）"
              missing=1
            fi
          done
          grep -E '^(tailscale|ddns-go|luci-app-ota|istoreos-ops|luci-app-quickstart) ' "$m" || true
        done
        exit "$missing"
  publish:
    name: 补发 r49 Releases
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download image artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: istoreos-x86_64-trimmed-r49
        path: bin/targets/x86/64
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: 41569983777
    - name: Publish to GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 恢复任务保留原镜像的版本号、构建提交和日志链接。
        export GITHUB_RUN_NUMBER=49
        export GITHUB_RUN_ID=41569983777
        export GITHUB_SHA=d90544a5ba4afcb2e9436fe20c05a3531fab22a5
        set -euo pipefail
        shopt -s nullglob
        tag="r${GITHUB_RUN_NUMBER}"
        imgs=(bin/targets/x86/64/*squashfs-combined-efi.img.gz)
        [ ${#imgs[@]} -ge 1 ] || { echo "::error::缺少 combined-efi.img.gz"; exit 1; }
        img=${imgs[0]}
        base=$(basename "$img")
        # OpenWrt sha256sums is binary-mode: "<hash> *<filename>". Text mode is
        # "<hash>  <filename>". r36 died here: grep '[ /]' misses the '*', and with
        # pipefail the failed grep aborts before the fallback (silent exit 1).
        sum=$(awk -v f="$base" '
          {
            name=$2
            sub(/^\*/, "", name)
            if (name == f) { print $1; exit }
          }
        ' bin/targets/x86/64/sha256sums)
        [ -n "$sum" ] || { echo "::error::sha256sums 里没有 $base"; exit 1; }
        {
          echo "TAG=${tag}"
          echo "ASSET=${base}"
          echo "SHA256=${sum}"
          echo "BROWSER_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${base}"
        } > bin/targets/x86/64/ota.meta
        cat bin/targets/x86/64/ota.meta
        files=(bin/targets/x86/64/*.img.gz bin/targets/x86/64/*.iso bin/targets/x86/64/sha256sums bin/targets/x86/64/*.manifest bin/targets/x86/64/ota.meta)
        [ ${#files[@]} -ge 1 ] || { echo "::error::没有可上传产物"; exit 1; }
        for f in "${files[@]}"; do
          [ -f "$f" ] || { echo "::error::缺少产物 $f，不建 Release"; exit 1; }
        done
        notes="iStoreOS 裁剪版（x86_64，目标机 J4125 四口 2.5G；先在 N100 验证，不要直接刷正在用的 J4125）。

        - 构建提交：\`${GITHUB_SHA:0:10}\`
        - 构建日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
        - 下载 \`*-squashfs-combined-efi.img.gz\`，**解压**得到 \`.img\` 后整盘写入（不是直接把 gz 写进盘）
        - 已刷裁剪版可用 LuCI「系统 → OTA」从本 Releases 检查/下载（校验 sha256；需手动确认刷写，不会自动刷）
        - 刷机步骤见仓库 \`BUILD-CUSTOM.md\`；裁剪记录见 \`docs/CUSTOM-TRIMMING.md\`
        - 包清单见 \`.manifest\`，校验值见 \`sha256sums\`"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
        else
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "iStoreOS 裁剪版 ${tag}" --notes "$notes"
        fi
