<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuCI 样式重构预览总览</title>
<style>
:root {
	--bg: #f4f6fb;
	--card: #fff;
	--border: #e9ecef;
	--text: #32325d;
	--muted: #8898aa;
	--primary: #5e72e4;
	--shadow: 0 4px 16px rgba(50,50,93,.08);
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #181819;
		--card: #232324;
		--border: #3a3a3d;
		--text: #d7dae0;
		--muted: #9aa2ad;
		--shadow: 0 4px 16px rgba(0,0,0,.3);
	}
}
body {
	background: var(--bg);
	color: var(--text);
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	margin: 0;
	padding: 40px 24px;
}
.container {
	max-width: 900px;
	margin: 0 auto;
}
.header {
	margin-bottom: 32px;
}
h1 {
	font-size: 26px;
	margin: 0 0 8px;
	color: var(--text);
}
p.sub {
	color: var(--muted);
	font-size: 14px;
	margin: 0;
	line-height: 1.6;
}
.grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
	gap: 20px;
}
.card {
	background: var(--card);
	border: 1px solid var(--border);
	border-radius: 14px;
	padding: 22px;
	box-shadow: var(--shadow);
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}
.card h2 {
	font-size: 18px;
	margin: 0 0 8px;
}
.card p {
	font-size: 13px;
	color: var(--muted);
	line-height: 1.6;
	margin: 0 0 16px;
	flex-grow: 1;
}
.links {
	display: flex;
	gap: 10px;
}
.btn {
	display: inline-block;
	flex: 1;
	text-align: center;
	padding: 8px 12px;
	border-radius: 8px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	transition: all .15s ease;
}
.btn-light {
	background: var(--primary);
	color: #fff;
}
.btn-light:hover {
	filter: brightness(1.1);
}
.btn-dark {
	background: rgba(0,0,0,.08);
	color: var(--text);
	border: 1px solid var(--border);
}
@media (prefers-color-scheme: dark) {
	.btn-dark {
		background: rgba(255,255,255,.08);
	}
}
.btn-dark:hover {
	background: var(--border);
}
</style>
</head>
<body>
<div class="container">
	<div class="header">
		<h1>🎨 LuCI 页面样式重构预览</h1>
		<p class="sub">遵循 docs/UI-STYLE.md 规范打造的现代卡片化、无 Bootstrap、全深色自适应样式预览。</p>
	</div>
	<div class="grid">
		<div class="card">
			<div>
				<h2>系统终端</h2>
				<p>Web Terminal 仿窗口外壳、三色圆点装饰、新标签页全屏打开入口与自适应视口高度。</p>
			</div>
			<div class="links">
				<a class="btn btn-light" href="preview-ttyd.html">浅色预览</a>
				<a class="btn btn-dark" href="preview-ttyd-dark.html">深色预览</a>
			</div>
		</div>
		<div class="card">
			<div>
				<h2>管理权 / 密码修改</h2>
				<p>收敛至 680px 白卡容器，弱/中/强密码强度圆角胶囊徽章与对齐表单。</p>
			</div>
			<div class="links">
				<a class="btn btn-light" href="preview-password.html">浅色预览</a>
				<a class="btn btn-dark" href="preview-password-dark.html">深色预览</a>
			</div>
		</div>
		<div class="card">
			<div>
				<h2>系统进程</h2>
				<p>白卡容器与表头美化，支持输入命令名或 PID 即时搜索过滤，指标徽章与紧凑动作按钮组。</p>
			</div>
			<div class="links">
				<a class="btn btn-light" href="preview-processes.html">浅色预览</a>
				<a class="btn btn-dark" href="preview-processes-dark.html">深色预览</a>
			</div>
		</div>
	</div>
</div>
</body>
</html>
