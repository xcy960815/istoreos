<%#
  Actions: test Telegram / test email / run health now
-%>
<div class="cbi-section">
	<h3><%:Actions%></h3>
	<p class="cbi-section-descr"><%:Save settings above first. Test buttons do not print secrets.%></p>
	<p>
		<button type="button" class="cbi-button cbi-button-apply" id="btn-test-tg"><%:Test Telegram%></button>
		<button type="button" class="cbi-button cbi-button-apply" id="btn-test-email"><%:Test Email%></button>
		<button type="button" class="cbi-button cbi-button-reload" id="btn-run-health"><%:Run health now%></button>
	</p>
	<pre id="istoreos-health-action-out" style="white-space:pre-wrap;max-height:24em;overflow:auto;"></pre>
</div>
<script type="text/javascript">//<![CDATA[
(function(){
	var out = document.getElementById('istoreos-health-action-out');
	var post = function(url, btn) {
		btn.disabled = true;
		out.textContent = '…';
		new XHR().post(url, { token: '<%=token%>' }, function(x){
			btn.disabled = false;
			var d = {};
			try { d = JSON.parse(x.responseText); } catch (e) { d = { code: 500, msg: x.responseText }; }
			out.textContent = 'code=' + d.code + '\n' + (d.msg || '') + (d.err ? ('\n' + d.err) : '');
		});
	};
	document.getElementById('btn-test-tg').onclick = function(){
		post('<%=url("admin/services/istoreos-health/test_telegram")%>', this);
	};
	document.getElementById('btn-test-email').onclick = function(){
		post('<%=url("admin/services/istoreos-health/test_email")%>', this);
	};
	document.getElementById('btn-run-health').onclick = function(){
		post('<%=url("admin/services/istoreos-health/run_health")%>', this);
	};
})();
//]]></script>
