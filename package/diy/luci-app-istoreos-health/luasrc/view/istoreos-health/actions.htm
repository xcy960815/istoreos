<%#
  Actions: test Telegram / run health now
  Also skins Map title/descr (#cbi-istoreos-health) + Notification section (UI-STYLE).
-%>
<div id="cbi-health">
	<style>
	#cbi-istoreos-health,
	#cbi-health {
		--health-accent: #5e72e4;
		--health-accent-2: #825ee4;
		--health-ok: #2dce89;
		--health-border: #e9ecef;
		--health-muted: #8898aa;
		--health-text: #32325d;
		--health-card: #fff;
		--health-soft: #f7f9fc;
	}
	#cbi-health.cbi-section,
	#cbi-health .cbi-section,
	#cbi-istoreos-health.cbi-section,
	#cbi-istoreos-health .cbi-section,
	#cbi-istoreos-health fieldset.cbi-section {
		padding: 0;
		border: 0;
		background: none;
		box-shadow: none;
		margin: 0;
	}
	body[theme="dark"] #cbi-istoreos-health,
	body[theme="dark"] #cbi-health {
		--health-border: #3a3a3d;
		--health-muted: #9aa2ad;
		--health-text: #d7dae0;
		--health-card: #232324;
		--health-soft: #2b2b2d;
	}
	@media (prefers-color-scheme: dark) {
		body[theme="normal"] #cbi-istoreos-health,
		body[theme="normal"] #cbi-health {
			--health-border: #3a3a3d;
			--health-muted: #9aa2ad;
			--health-text: #d7dae0;
			--health-card: #232324;
			--health-soft: #2b2b2d;
		}
	}
	#cbi-istoreos-health > h2 {
		margin: 0 0 6px;
		font-size: 18px;
		font-weight: 600;
		line-height: 1.3;
		color: var(--health-text);
	}
	#cbi-istoreos-health .cbi-map-descr {
		margin: 0 0 16px;
		font-size: 13px;
		line-height: 1.6;
		color: var(--health-muted);
	}
	#cbi-istoreos-health .health-head {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		gap: 8px 16px;
		flex-wrap: wrap;
		margin: 0 0 16px;
		padding: 16px 22px;
		background: var(--health-card);
		border: 1px solid var(--health-border);
		border-radius: 12px;
		box-shadow: 0 2px 12px rgba(50, 50, 93, .06);
	}
	#cbi-istoreos-health .health-head > h2 {
		margin: 0;
		font-size: 18px;
		font-weight: 600;
		line-height: 1.3;
		color: var(--health-text);
	}
	#cbi-istoreos-health .health-head > .cbi-map-descr {
		margin: 0 0 0 auto;
		font-size: 13px;
		line-height: 1.6;
		color: var(--health-muted);
		text-align: right;
	}
	#cbi-istoreos-health fieldset.cbi-section {
		background: var(--health-card);
		border: 1px solid var(--health-border);
		border-radius: 12px;
		box-shadow: 0 2px 12px rgba(50, 50, 93, .06);
		padding: 20px 22px;
		margin: 0 0 16px;
	}
	#cbi-istoreos-health fieldset.cbi-section > legend {
		padding: 0;
		margin: 0 0 12px;
		font-size: 15px;
		font-weight: 600;
		color: var(--health-text);
		background: none;
		border: 0;
	}
	#cbi-istoreos-health fieldset.cbi-section .cbi-value {
		display: flex;
		align-items: flex-start;
		gap: 12px 18px;
		padding: 12px 0;
		margin: 0;
		border-top: 1px solid var(--health-border);
		border-bottom: 0;
		flex-wrap: wrap;
	}
	#cbi-istoreos-health fieldset.cbi-section .cbi-value:first-of-type {
		border-top: 0;
		padding-top: 4px;
	}
	#cbi-istoreos-health fieldset.cbi-section .cbi-value:last-child {
		padding-bottom: 4px;
	}
	#cbi-istoreos-health fieldset.cbi-section .cbi-value-title {
		width: 190px;
		flex-shrink: 0;
		padding: 6px 0 0;
		font-size: 13px;
		font-weight: 600;
		color: var(--health-text);
		text-align: left;
	}
	#cbi-istoreos-health fieldset.cbi-section .cbi-value-field {
		flex: 1;
		min-width: 220px;
		text-align: left;
	}
	#cbi-istoreos-health fieldset.cbi-section .cbi-value-description {
		margin: 6px 0 0;
		font-size: 12px;
		line-height: 1.6;
		color: var(--health-muted);
	}
	#cbi-istoreos-health .cbi-page-actions .cbi-button {
		min-width: 132px;
		padding: 8px 18px;
		border-radius: 8px;
		font-size: 14px;
		font-weight: 600;
	}
	#cbi-health .health-card {
		background: var(--health-card);
		border: 1px solid var(--health-border);
		border-radius: 12px;
		box-shadow: 0 2px 12px rgba(50, 50, 93, .06);
		padding: 20px 22px;
		margin: 0 0 16px;
	}
	#cbi-health .health-title {
		margin: 0;
		font-size: 18px;
		font-weight: 600;
		line-height: 1.3;
		color: var(--health-text);
	}
	#cbi-health .health-sub {
		margin: 6px 0 0;
		font-size: 13px;
		line-height: 1.6;
		color: var(--health-muted);
	}
	#cbi-health .health-actions {
		display: flex;
		align-items: center;
		gap: 12px;
		flex-wrap: wrap;
		margin-top: 16px;
	}
	#cbi-health .health-btn {
		min-width: 132px;
		padding: 8px 18px;
		border-radius: 8px;
		font-size: 14px;
	}
	#cbi-health .health-out {
		display: block;
		margin: 16px 0 0;
		padding: 12px 14px;
		max-height: 24em;
		overflow: auto;
		border: 1px solid var(--health-border);
		border-radius: 10px;
		background: var(--health-soft);
		color: var(--health-text);
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		font-size: 12px;
		line-height: 1.6;
		white-space: pre-wrap;
		word-break: break-word;
	}
	#cbi-health .health-out:empty { display: none; }
	</style>

	<div class="cbi-section">
		<div class="health-card">
			<h3 class="health-title"><%:Actions%></h3>
			<p class="health-sub"><%:Save settings above first. Test button does not print secrets.%></p>
			<div class="health-actions">
				<button type="button" class="cbi-button cbi-button-apply health-btn" id="btn-test-tg"><%:Test Telegram%></button>
				<button type="button" class="cbi-button cbi-button-reload health-btn" id="btn-run-health"><%:Run health now%></button>
			</div>
			<pre id="istoreos-health-action-out" class="health-out"></pre>
		</div>
	</div>
</div>
<script type="text/javascript">//<![CDATA[
(function(){
	var wrap = function() {
		var root = document.getElementById('cbi-istoreos-health');
		if (!root || root.querySelector('.health-head'))
			return;
		var h2 = null, descr = null, kids = root.children, i;
		for (i = 0; i < kids.length; i++) {
			if (!h2 && kids[i].tagName === 'H2')
				h2 = kids[i];
			else if (!descr && kids[i].classList && kids[i].classList.contains('cbi-map-descr'))
				descr = kids[i];
		}
		if (h2 && descr) {
			var head = document.createElement('div');
			head.className = 'health-head';
			root.insertBefore(head, h2);
			head.appendChild(h2);
			head.appendChild(descr);
		}
	};
	if (document.readyState === 'loading')
		document.addEventListener('DOMContentLoaded', wrap);
	else
		wrap();

	var out = document.getElementById('istoreos-health-action-out');
	var post = function(url, btn) {
		btn.disabled = true;
		out.textContent = '…';
		new XHR().post(url, { token: '<%=token%>' }, function(x){
			btn.disabled = false;
			var d = {};
			try { d = JSON.parse(x.responseText); } catch (e) { d = { code: 500, msg: x.responseText }; }
			out.textContent = 'code=' + d.code + '\n' + (d.msg || '') + (d.err ? ('\n' + d.err) : '');
		});
	};
	document.getElementById('btn-test-tg').onclick = function(){
		post('<%=url("admin/services/istoreos-health/test_telegram")%>', this);
	};
	document.getElementById('btn-run-health').onclick = function(){
		post('<%=url("admin/services/istoreos-health/run_health")%>', this);
	};
})();
//]]></script>
